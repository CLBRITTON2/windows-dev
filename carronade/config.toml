# Linked to %APPDATA%\carronade\config.toml. Fields are documented in the carronade repo's config.toml.

[font]
family = "Segoe UI Variable Text"
size = 11

[window]
width = "45em"
background = "#141418e0"
border = "3px"
border_color = "#ffffff59"
radius = "1em"
image = '~\Downloads\wallpaper.jpg'

[input]
margin = "3em"
padding = "1em"
radius = "2em"
background = "#1c1c22eb"
color = "#ffffff"
prompt = "\uf061"
prompt_font = "JetBrainsMono NFP"
prompt_gap = "1em"
placeholder = "Search"
placeholder_color = "#ffffffb3"
apps_icon = ""
files_icon = ""

[list]
background = "#141418e0"
padding = "1.5em"
spacing = "0.5em"
columns = 2
lines = 3

[element]
padding = "0.5em"
radius = "1.5em"
color = "#ffffff"
selected = "#ffffff2e"
icon = "3em"
gap = "0.5em"

[drun]
cache = true

[files]
roots = ['~\dev']
cache = true
terminal = 'pwsh'
