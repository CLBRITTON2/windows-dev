// intarsia reads this from %USERPROFILE%\.config\intarsia\style.conf, beside config.lua. Anything it doesn't take is
// an error naming the line. docs\styling.md lists every block and the properties each takes.
//
// A block is a key ending in a colon, and its lines sit two spaces deeper. bar sets the font and color every module
// inherits, section and tooltip and menu their boxes, module every module, and a module's name in config.lua that one
// module, over module. Inside a module: icon, item (a workspace, window, binding mode or tray icon, with its states
// focused, occupied, empty and toggle), hover, alert, and warning, critical, muted or expanded where the module has
// them. Hover changes only color and background.
//
// Numbers are DIPs with no unit. padding and margin take one number, or two: above and below, then left and right.

// Every color is set here, and the blocks below only use these names. A color's percent is its opacity.
vars:
  // Text, and the dimmer text of empty workspaces and of the layouts not in use.
  text: #e0def4
  dim: #908caa

  // The tint over the frosted glass behind each section, and behind tooltips and menus. brightness below cuts the
  // desktop behind the glass to under a third, and this tint covers most of what is left, so glass over a white
  // desktop and glass over a dark one end up close to the same shade. Lower the opacity to let more of the desktop
  // show, at the cost of glass that follows its light and dark patches.
  glass: #0e0c16 65%
  popup: #0e0c16 72%

  // Light on the glass: its bright top edge, its other edges, and the sheen falling from its top.
  shine: #ffffff 55%
  edge: #ffffff 20%
  sheen: #ffffff 16%

  // A cut through the glass between the workspaces, the apps and the date: its shadowed wall and its lit one.
  cut: #000000 85%
  cut-light: #ffffff 32%

  // Behind whatever the cursor is on, and behind the focused window's icon and the binding mode.
  hover: #ffffff 10%
  selected: #e0def4 14%

  // The focused workspace: its glass and its text.
  accent: #ebbcba 85%
  accent-text: #191724

  // Icons, and the colors of a low battery and of an alert.
  cyan: #9ccfd8
  magenta: #c4a7e7
  rose: #ebbcba
  gold: #f6c177
  red: #eb6f92

bar:
  font: JetBrainsMono Nerd Font
  size: 15
  color: $text

// Lit from above: the bright edge on top, the sheen just under it, and the dimmer edge on the other sides.
section:
  margin: 5
  padding: 4
  background: $glass
  blur: on
  brightness: 0.3
  saturate: 1.8
  border: 1 $edge
  border-top: 1 $shine
  radius: 14
  shadow: 0 1 0 $sheen, 0 14 16 -8 $sheen

tooltip:
  padding: 6
  background: $popup
  blur: on
  brightness: 0.3
  saturate: 1.8
  border: 1 $edge
  border-top: 1 $shine
  radius: 12

// Past max-width each entry ends in an ellipsis, and past max-height the entries scroll.
menu:
  padding: 8
  background: $popup
  blur: on
  brightness: 0.3
  saturate: 1.8
  border: 1 $edge
  border-top: 1 $shine
  radius: 14
  max-width: 560
  max-height: 420
  scrollbar:
    width: 4
    margin: 4 3
    background: $dim
    radius: 2
  item:
    padding: 5 8
    radius: 8
    hover:
      background: $hover
    // The ziti menu marks its section headers active.
    active:
      color: $magenta
      weight: bold

// Every module's content sits 9 inside its box along the bar, so any two neighbours are 18 apart. A module of items
// takes what its first and last items' padding and margin leave of the 9.
module:
  padding: 0 9
  radius: 10
  transition: background 150ms ease
  // Propo keeps icon glyphs at their natural width, the plain Nerd Font squeezes them into one cell.
  icon:
    font: JetBrainsMono Nerd Font Propo
    size: 18
    margin-right: 6
  alert:
    color: $red
  // Each item fades into its hover and into a new state, as the focus moves from one workspace to the next. Under the
  // cursor, a state's own colors win over this hover, so the focused workspace keeps its look.
  item:
    transition: background 150ms ease, color 150ms ease
    hover:
      color: $text
      background: $hover

// The workspaces' margin sets them 5 before the line that opens the apps.
workspaces:
  padding: 0 1
  margin: 0 4
  // A one-character name is a circle: its 9 wide glyph plus 7 each side matches its line's height plus 2 each side.
  item:
    padding: 2 7
    margin: 0 1
    radius: 999
    // Tinted glass, lit along its top edge. It lights at once as the focus arrives, and fades as the focus leaves.
    focused:
      color: $accent-text
      background: $accent
      weight: bold
      shadow: 0 1 0 $shine
      transition: none
    empty:
      color: $dim

// Window icons draw at the icon's size. The margin across the bar cuts the lines beside them to their height. With the
// items' 3 padding and 1.5 margin, the icons sit 13 from each line, as the last number does, and as far from the
// section's edge as the first number. Each cut reads shadowed wall then lit wall from left to right, so the light falls
// the same way on both. The radius stays 0, or it bends the line into an arc.
apps:
  padding: 0 8.5
  margin: 5 0
  border-left: 1 $cut
  shadow: 1 0 0 $cut-light
  radius: 0
  item:
    padding: 3
    margin: 0 1.5
    radius: 6
    focused:
      background: $selected

// The apps where the date follows them, with a cut between.
apps_left:
  padding: 0 8.5
  margin: 5 0
  border-left: 1 $cut
  border-right: 1 $cut-light
  shadow: 1 0 0 $cut-light, -1 0 0 $cut
  radius: 0
  item:
    padding: 3
    margin: 0 1.5
    radius: 6
    focused:
      background: $selected

// As the workspaces' margin does, this sets the date 13 from the line before it, and as far from the section's edge as
// the first number.
date:
  margin: 0 4
  hover:
    background: $hover
  icon:
    color: $magenta

// Icons cycle cyan, magenta, rose from right to left: battery, mic, volume, memory, cpu, net, tiling, layout, ziti,
// tray, date. Every module with an icon takes the next color, so a new one goes in its place in the cycle.

// Tray icons, and the toggle's chevron after them, draw at the icon's size. A tray's own transition replaces the
// module's, so it names the background fade again beside its width as it unfolds. Its icon turns while unfolded.
tray:
  padding: 0 3
  transition: width 400ms ease-out, background 150ms ease
  icon:
    size: 16
    color: $cyan
    transition: rotate 300ms ease
  expanded:
    icon:
      rotate: 180
  item:
    padding: 4
    margin: 0 2
    radius: 6
    toggle:
      padding: 7 6
      margin: 0
      radius: 10

ziti:
  hover:
    background: $hover
  icon:
    color: $rose

// The layout group unfolds its members as the tray does. Its icon keeps its orientation, so it takes no rotate.
layout:
  transition: width 400ms ease-out, background 150ms ease
  hover:
    background: $hover
  icon:
    color: $magenta

layout_single:
  color: $dim
  hover:
    background: $hover

layout_dual:
  color: $dim
  hover:
    background: $hover

mode:
  padding: 0
  item:
    color: $magenta
    background: $selected
    weight: bold
    padding: 2 8
    margin: 0 1
    radius: 999

tiling:
  hover:
    background: $hover
  icon:
    color: $cyan

net:
  hover:
    background: $hover
  icon:
    color: $rose

cpu:
  hover:
    background: $hover
  icon:
    color: $magenta

memory:
  hover:
    background: $hover
  icon:
    color: $cyan

volume:
  hover:
    background: $hover
  icon:
    color: $rose

mic:
  hover:
    background: $hover
  icon:
    color: $magenta

battery:
  hover:
    background: $hover
  icon:
    color: $cyan
  warning:
    icon:
      color: $gold
  critical:
    icon:
      color: $red
