<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" type="text/css" href="../normalize.css" />
  <link rel="icon" href="data:;" />

  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
    integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo=" crossorigin="anonymous"></script>

  <style>
    :root {
      --color-foreground: #e0def4;
      --color-foreground-muted: #908caa;
      --color-background: rgba(25, 23, 36, 0.97);
      --color-border: rgba(110, 106, 134, 0.25);
      --color-cyan: #9ccfd8;
      --color-accent-alt: #c4a7e7;
      --color-hover: rgba(64, 61, 82, 0.8);
      --color-red: #eb6f92;
      height: 100%;
      color: var(--color-foreground);
      font-family: "JetBrainsMono Nerd Font", ui-monospace, monospace;
      font-size: 13px;
    }

    body,
    #root {
      height: 100%;
      margin: 0;
    }

    .menu {
      max-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--color-background);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 8px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .menu::-webkit-scrollbar {
      width: 6px;
    }

    .menu::-webkit-scrollbar-thumb {
      background: var(--color-foreground-muted);
      border-radius: 3px;
    }

    .menu::-webkit-scrollbar-track {
      background: transparent;
    }

    .section + .section {
      margin-top: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 4px;
      color: var(--color-accent-alt);
      font-weight: 600;
    }

    .section-header .view-all {
      background: none;
      border: none;
      color: var(--color-foreground-muted);
      font: inherit;
      font-weight: 400;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 6px;
    }

    .section-header .view-all:hover {
      background: var(--color-hover);
      color: var(--color-foreground);
    }

    .item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--color-foreground);
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      padding: 5px 8px;
    }

    .item:hover {
      background: var(--color-hover);
    }

    .item-title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-repo {
      display: block;
      color: var(--color-foreground-muted);
      font-size: 0.85rem;
    }

    .empty,
    .loading {
      color: var(--color-foreground-muted);
      padding: 5px 8px;
    }

    .error {
      color: var(--color-red);
      padding: 5px 8px;
      white-space: normal;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@18";
    import { createRoot } from "https://esm.sh/react-dom@18/client";
    import * as zebar from "https://esm.sh/zebar@3";
    import { LogicalSize } from "https://esm.sh/@tauri-apps/api@2/dpi";

    const GITHUB_USER = "CLBRITTON2";
    const GITHUB_ORGS = "org:openziti org:netfoundry";
    const SECTIONS = [
      { key: "prs", title: "Pull requests", query: `${GITHUB_ORGS} is:open is:pr author:${GITHUB_USER}`, type: "pullrequests" },
      { key: "issues", title: "Issues", query: `${GITHUB_ORGS} is:open is:issue author:${GITHUB_USER}`, type: "issues" },
      { key: "assigned", title: "Assigned to me", query: `${GITHUB_ORGS} is:open is:issue assignee:${GITHUB_USER}`, type: "issues" },
    ];

    const widget = zebar.currentWidget();

    widget.tauriWindow.onFocusChanged(({ payload: focused }) => {
      if (!focused) widget.close();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") widget.close();
    });

    function searchUrl(section) {
      return `https://github.com/search?q=${encodeURIComponent(section.query)}&type=${section.type}`;
    }

    const CHROME_PATH = "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe";

    function openInBrowser(url) {
      zebar.shellExec(CHROME_PATH, [url]).catch((err) =>
        console.error("failed to open browser", { url, err })
      );
      widget.close();
    }

    function repoName(item) {
      return item.repository_url.split("/").slice(-2).join("/");
    }

    function Section({ section }) {
      const [items, setItems] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetch(`https://api.github.com/search/issues?q=${encodeURIComponent(section.query)}&per_page=20`)
          .then((res) => (res.ok ? res.json() : Promise.reject(new Error(`GitHub search ${res.status}`))))
          .then((data) => setItems(data.items))
          .catch((err) => setError(err));
      }, []);

      return (
        <div className="section">
          <div className="section-header">
            <span>{section.title}{items && ` (${items.length})`}</span>
            <button className="view-all" onClick={() => openInBrowser(searchUrl(section))}>
              view all
            </button>
          </div>
          {error && <div className="error">{String(error)}</div>}
          {!error && !items && <div className="loading">Loading...</div>}
          {items && items.length === 0 && <div className="empty">Nothing open</div>}
          {items && items.map((item) => (
            <button className="item" key={item.id} title={item.title} onClick={() => openInBrowser(item.html_url)}>
              <span className="item-title">{item.title}</span>
              <span className="item-repo">{repoName(item)} #{item.number}</span>
            </button>
          ))}
        </div>
      );
    }

    const MENU_WIDTH = 380;
    const MENU_MAX_HEIGHT = 700;

    function Menu() {
      useEffect(() => {
        const el = document.querySelector(".menu");
        const observer = new ResizeObserver(() => {
          const height = Math.min(el.scrollHeight + 2, MENU_MAX_HEIGHT);
          widget.tauriWindow
            .setSize(new LogicalSize(MENU_WIDTH, height))
            .catch((err) => console.error("menu resize failed", { err }));
        });
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      return (
        <div className="menu">
          {SECTIONS.map((section) => (
            <Section section={section} key={section.key} />
          ))}
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<Menu />);
  </script>
</body>

</html>
