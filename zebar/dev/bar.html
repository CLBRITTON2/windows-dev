<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" type="text/css" href="../normalize.css" />
  <link rel="stylesheet" type="text/css" href="./styles.css" />
  <link rel="icon" href="data:;" />

  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
    integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo=" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@18";
    import { createRoot } from "https://esm.sh/react-dom@18/client";
    import * as zebar from "https://esm.sh/zebar@3";
    import { currentMonitor } from "https://esm.sh/@tauri-apps/api@2/window";

    // =============================================
    // ICON MAP: process name (lowercase) -> icon file
    // =============================================
    const ICON_MAP = {
      "clash for windows": "Clash-32.png",
      "unity hub": "Unity-Hub-32.png",
      acrobat: "Acrobat-32.png",
      applicationframehost: "SystemSettings-32.png",
      autohotkeyux: "AutoHotkeyUX-32.png",
      chrome: "chrome-32.png",
      code: "Visual-Studio-Code-32.png",
      controlpanel: "control-panel-32.png",
      cursor: "cursor-32.png",
      devenv: "Visual-Studio-32.png",
      everything: "Everything-32.png",
      excel: "EXCEL-32.png",
      explorer: "file-explorer-32.png",
      firefox: "Firefox-32.png",
      idea64: "idea64-32.png",
      matlab: "matlab-32.png",
      mintty: "mintty-32.png",
      msedgewebview2: "Edge-32.png",
      notepad: "Notepad-32.png",
      obs64: "obs64-32.png",
      obsidian: "Obsidian-32.png",
      memreduct: "memreduct-32.png",
      mspaint: "mspaint-32.png",
      powerpnt: "POWERPNT-32.png",
      qq: "QQ-32.png",
      regedit: "regedit-32.png",
      snippingtool: "SnippingTool-32.png",
      spotify: "Spotify-32.png",
      steamwebhelper: "Steam-32.png",
      sublime_text: "Sublime-Text-32.png",
      taskmgr: "Taskmgr-32.png",
      virtualbox: "VirtualBox-32.png",
      windowsterminal: "Terminal-32.png",
      winword: "WINWORD-32.png",
      "notepad++": "Notepad++-32.png",
      discord: "Discord-32.png",
      githubdesktop: "Github-32.png",
      "wezterm-gui": "WezTerm-32.png",
      "docker desktop": "Docker-32.png",
      mattermost: "MatterMost-32.png",
      zoom: "Zoom-32.png"
    };
    const ICON_BASE = "./assets/icons/";
    const DEFAULT_ICON_FILE = "Application-32.png";

    function getIconSrc(processName) {
      const key = (processName || "").toLowerCase().trim();
      const fileName = ICON_MAP[key] ?? DEFAULT_ICON_FILE;
      return `${ICON_BASE}${fileName}`;
    }

    const GITHUB_USER = "CLBRITTON2";
    const GITHUB_ORGS = "org:openziti org:netfoundry";
    const ZITI_MENU_WIDTH = 380;

    async function openZitiMenu(buttonEl) {
      const monitor = await currentMonitor();
      const winPos = await zebar.currentWidget().tauriWindow.outerPosition();
      const scale = monitor?.scaleFactor ?? window.devicePixelRatio;
      const rect = buttonEl.getBoundingClientRect();
      // Center the menu under the icon, clamped to the monitor's right edge
      const iconCenterX = (winPos.x - (monitor?.position.x ?? 0)) / scale + rect.left + rect.width / 2;
      const monitorWidth = (monitor?.size.width ?? screen.width * scale) / scale;
      const left = Math.max(5, Math.min(iconCenterX - ZITI_MENU_WIDTH / 2, monitorWidth - ZITI_MENU_WIDTH - 5));
      const monitorSelection = monitor?.name
        ? { type: "name", match: monitor.name }
        : { type: "primary" };
      await zebar.startWidget("ziti-menu", {
        anchor: "top_left",
        offsetX: `${Math.round(left)}px`,
        offsetY: "48px",
        width: `${ZITI_MENU_WIDTH}px`,
        height: "160px",
        monitorSelection,
        dockToEdge: { enabled: false, edge: null, windowMargin: "0px" },
      });
    }

    function ZitiMenuButton() {
      const [count, setCount] = useState(null);

      useEffect(() => {
        let cancelled = false;
        async function refresh() {
          try {
            const q = encodeURIComponent(`${GITHUB_ORGS} is:open author:${GITHUB_USER}`);
            const res = await fetch(`https://api.github.com/search/issues?q=${q}`);
            if (!res.ok) throw new Error(`GitHub search ${res.status}`);
            const data = await res.json();
            if (!cancelled) setCount(data.total_count);
          } catch (err) {
            console.warn("ziti count fetch failed", { err });
          }
        }
        refresh();
        const id = setInterval(refresh, 60 * 1000);
        return () => { cancelled = true; clearInterval(id); };
      }, []);

      return (
        <button
          className="box ziti-toggle"
          title="OpenZiti GitHub"
          onClick={(e) => openZitiMenu(e.currentTarget)}
        >
          <img className="ziti-icon" src="./assets/icons/Ziti-32.png" alt="ziti" />
          {count != null && <span className="info">{count}</span>}
        </button>
      );
    }

    // Recursively collect windows from workspace children (handles split containers)
    function collectWindows(child) {
      if (child.type === "window") return [child];
      if (child.type === "split" && child.children) {
        return child.children.flatMap(collectWindows);
      }
      return [];
    }

    function CurrentApps({ glazewm }) {
      // currentWorkspaces is scoped to this bar's monitor; allWorkspaces would
      // mix in other monitors' apps on a multi-monitor setup.
      const windows = (glazewm.currentWorkspaces || [])
        .filter((ws) => ws.isDisplayed)
        .flatMap((ws) => (ws.children || []).flatMap(collectWindows));

      return (
        <>
          {windows.map((win) => (
            <button
              className={`app-element ${win.hasFocus ? "app-focus" : ""}`}
              key={win.handle}
              title={win.title}
              onClick={() =>
                glazewm.runCommand(
                  `shell-exec %userprofile%/.glzr/zebar/dev/assets/scripts/FocusWindow.ahk ${win.handle}`
                )
              }
            >
              <img
                className="app-icon"
                src={getIconSrc(win.processName)}
                alt={win.processName}
              />
            </button>
          ))}
        </>
      );
    }

    async function fetchGeoLocation() {
      // Bound the request: ip-api is HTTP-only and rate-limited, and a hung
      // socket here would block the whole bar from rendering (top-level await).
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      try {
        const res = await fetch("http://ip-api.com/json/?fields=lat,lon", {
          signal: controller.signal,
        });
        const data = await res.json();
        return { latitude: data.lat, longitude: data.lon };
      } finally {
        clearTimeout(timeout);
      }
    }

    const geo = await fetchGeoLocation().catch(() => null);

    const providers = zebar.createProviderGroup({
      network: { type: "network" },
      glazewm: { type: "glazewm" },
      cpu: { type: "cpu", refreshInterval: 1000 },
      date: { type: "date", formatting: "EEE d MMM yyyy, t" },
      memory: { type: "memory", refreshInterval: 1000 },
      weather: { type: "weather", ...geo },
      audio: { type: "audio" },
      systray: { type: "systray" },
    });

    createRoot(document.getElementById("root")).render(<App />);

    function App() {
      const [output, setOutput] = useState(providers.outputMap);
      const [systrayExpanded, setSystrayExpanded] = useState(false);

      useEffect(() => {
        const unlisten = providers.onOutput(() => setOutput({ ...providers.outputMap }));
        return () => unlisten?.();
      }, []);

      function getNetworkIcon(networkOutput) {
        switch (networkOutput.defaultInterface?.type) {
          case "ethernet":
            return (
              <>
                <span className="icon ethernet-icon">󰈀</span>
                <span className="accent">Connected</span>
              </>
            );
          case "wifi":
            if (networkOutput.defaultGateway?.signalStrength >= 80) {
              return <span className="icon wifi-icon">󰤨</span>;
            } else if (networkOutput.defaultGateway?.signalStrength >= 65) {
              return <span className="icon wifi-icon">󰤥</span>;
            } else if (networkOutput.defaultGateway?.signalStrength >= 40) {
              return <span className="icon wifi-icon">󰤢</span>;
            } else if (networkOutput.defaultGateway?.signalStrength >= 25) {
              return <span className="icon wifi-icon">󰤟</span>;
            } else {
              return <span className="icon wifi-icon magenta">󰤯</span>;
            }
          default:
            return <span className="magenta">⌀ No internet</span>;
        }
      }

      function getAudioIcon(device) {
        const volume = device.isMuted ? 0 : device.volume;
        if (volume > 20) {
          return <span className="icon audio-icon"></span>;
        } else if (volume > 10) {
          return <span className="icon audio-icon"></span>;
        } else if (volume > 0) {
          return <span className="icon audio-icon"></span>;
        } else {
          return <span className="icon audio-icon"></span>;
        }
      }

      function getWeatherIcon(weatherOutput) {
        switch (weatherOutput.status) {
          case "clear_day":
            return <span className="icon weather-icon yellow">☀</span>;
          case "clear_night":
            return <span className="icon weather-icon yellow">☽</span>;
          case "cloudy_day":
            return <span className="icon weather-icon"></span>;
          case "cloudy_night":
            return <span className="icon weather-icon"></span>;
          case "light_rain_day":
            return <span className="icon weather-icon"></span>;
          case "light_rain_night":
            return <span className="icon weather-icon"></span>;
          case "heavy_rain_day":
            return <span className="icon weather-icon"></span>;
          case "heavy_rain_night":
            return <span className="icon weather-icon"></span>;
          case "snow_day":
            return <span className="icon weather-icon"></span>;
          case "snow_night":
            return <span className="icon weather-icon"></span>;
          case "thunder_day":
            return <span className="icon weather-icon"></span>;
          case "thunder_night":
            return <span className="icon weather-icon"></span>;
          default:
            return <span className="icon weather-icon">?</span>;
        }
      }

      function formatWeatherStatus(status) {
        return (status || "").replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function bytesToGigabytes(bytes) {
        return (bytes / (1024 * 1024 * 1024)).toFixed(1);
      }

      return (
        <div className="app">
          <div className="left">
            {output.glazewm && (
              <div className="box">
                {output.glazewm.currentWorkspaces.map((workspace) => {
                  const hasWindows = (workspace.children || []).flatMap(collectWindows).length > 0;
                  return (
                    <button
                      className={`workspace-button ${workspace.hasFocus ? "focused" : ""} ${hasWindows ? "has-child" : ""}`}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `focus --workspace ${workspace.name}`
                        )
                      }
                      key={workspace.name}
                    >
                      {workspace.name}
                    </button>
                  );
                })}
              </div>
            )}

            {output.glazewm && (
              <>
                <div className="left-divider"></div>
                <div className="box app-list">
                  <CurrentApps glazewm={output.glazewm} />
                </div>
              </>
            )}
          </div>

          <div className="center">
            {output.date && (
              <div className="box" onClick={() => output.glazewm.runCommand('shell-exec explorer.exe ms-settings:dateandtime')}>
                <span className="icon date-icon">󱑁</span>
                <span className="info">{output.date?.formatted}</span>
              </div>
            )}
          </div>

          <div className="right">
            {output.systray && (
              <div className="box systray-container">
                <div className={`systray ${systrayExpanded ? "expanded" : ""}`}>
                  {output.systray.icons?.map((icon) => (
                    <div
                      className="systray-icon-container"
                      title={icon.tooltip}
                      key={icon.id}
                      onClick={(e) => {
                        e.preventDefault();
                        output.systray.onLeftClick(icon.id);
                      }}
                      onContextMenu={(e) => {
                        e.preventDefault();
                        output.systray.onRightClick(icon.id);
                      }}
                    >
                      <img className="systray-icon" src={icon.iconUrl} />
                    </div>
                  ))}
                </div>

                <button
                  className={`systray-toggle ${systrayExpanded ? "expanded" : "tucked"}`}
                  onClick={() => setSystrayExpanded(!systrayExpanded)}
                >
                  <span className={`systray-arrow ${systrayExpanded ? "expanded" : ""}`}></span>
                </button>
              </div>
            )}

            <ZitiMenuButton />

            {output.glazewm && (
              <div className="box">
                {output.glazewm.bindingModes.map((bindingMode) => (
                  <button className="binding-mode" key={bindingMode.name}>
                    {bindingMode.displayName ?? bindingMode.name}
                  </button>
                ))}

                <button
                  className="tiling-direction-icon"
                  onClick={() =>
                    output.glazewm.runCommand("toggle-tiling-direction")
                  }
                >
                  {output.glazewm.tilingDirection === "horizontal"
                    ? "⇄"
                    : "⇵"}
                </button>
              </div>
            )}

            {output.network && output.glazewm && (
              <div className="box" title={[
                output.network.defaultInterface?.type?.toUpperCase(),
                output.network.defaultGateway?.ssid && `SSID: ${output.network.defaultGateway.ssid}`,
                output.network.defaultGateway?.signalStrength != null && `Signal: ${output.network.defaultGateway.signalStrength}%`,
                output.network.defaultInterface?.ipv4Addresses?.[0] && `IP: ${output.network.defaultInterface.ipv4Addresses[0]}`,
                output.network.traffic && `↓ ${output.network.traffic.received.siValue.toFixed(1)} ${output.network.traffic.received.siUnit}/s  ↑ ${output.network.traffic.transmitted.siValue.toFixed(1)} ${output.network.traffic.transmitted.siUnit}/s`,
              ].filter(Boolean).join('\n')} onClick={() => output.glazewm.runCommand('shell-exec explorer.exe ms-settings:network-status')}>{getNetworkIcon(output.network)}</div>
            )}

            {output.cpu && output.glazewm && (
              <div className="box" title={[
                output.cpu.vendor,
                `${output.cpu.physicalCoreCount} cores / ${output.cpu.logicalCoreCount} threads`,
              ].join('\n')} onClick={() => output.glazewm.runCommand('shell-exec taskmgr')}>
                <span className="icon cpu-icon"></span>
                <span className="info">{Math.round(output.cpu.usage)}%</span>
              </div>
            )}

            {output.memory && output.glazewm && (
              <div className="box" title={[
                `Total: ${bytesToGigabytes(output.memory.totalMemory)} GB`,
                output.memory.totalSwap > 0 && `Swap: ${bytesToGigabytes(output.memory.usedSwap)} / ${bytesToGigabytes(output.memory.totalSwap)} GB`,
              ].filter(Boolean).join('\n')} onClick={() => output.glazewm.runCommand('shell-exec cmd /c start "" "C:\\Program Files\\Mem Reduct\\memreduct.exe"')}>
                <span className="icon memory-icon"></span>
                <span className="info">
                  {bytesToGigabytes(output.memory.usedMemory)} GBs
                </span>
              </div>
            )}

            {output.audio?.defaultPlaybackDevice && output.glazewm && (
              <div className="box" title={[
                output.audio.defaultPlaybackDevice.name,
                output.audio.defaultPlaybackDevice.isMuted ? 'Muted' : `Volume: ${Math.round(output.audio.defaultPlaybackDevice.volume)}%`,
                'Scroll to adjust',
              ].join('\n')} onClick={() => output.glazewm.runCommand('shell-exec sndvol.exe')}
                onWheel={(e) => {
                  const step = e.deltaY < 0 ? 2 : -2;
                  const next = Math.max(0, Math.min(100, Math.round(output.audio.defaultPlaybackDevice.volume) + step));
                  output.audio.setVolume(next);
                }}>
                {getAudioIcon(output.audio.defaultPlaybackDevice)}
                <span className="info">
                  {Math.round(output.audio.defaultPlaybackDevice.volume)}%
                </span>
              </div>
            )}

            {output.weather && (
              <div className="box" title={[
                formatWeatherStatus(output.weather.status),
                `Wind: ${(output.weather.windSpeed * 0.6214).toFixed(1)} mph`,
                `${Math.round(output.weather.celsiusTemp)}°C / ${Math.round(output.weather.fahrenheitTemp)}°F`,
              ].join('\n')}>
                {getWeatherIcon(output.weather)}
                <span className="info">
                  {Math.round(output.weather.fahrenheitTemp)}°F
                </span>
              </div>
            )}
          </div>
        </div>
      );
    }
  </script>
</body>

</html>
