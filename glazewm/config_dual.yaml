general:
  startup_commands:
    - 'focus --workspace 1'
    - 'shell-exec %USERPROFILE%/dev/intarsia/build/release/intarsia.exe'
    - 'shell-exec C:/Program Files/thide/bin/thide.exe'
    # Launched through the .ahk file association because the AutoHotkey install path differs per machine.
    - 'shell-exec %USERPROFILE%/dev/windows-dev/glazewm/winkey-fix.ahk'
  shutdown_commands:
    # No /F: each bar handles WM_CLOSE and releases its strip of the work area.
    - 'shell-exec taskkill /IM intarsia.exe'
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: true
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '5px'
  outer_gap:
    top: '54px'
    right: '5px'
    bottom: '5px'
    left: '5px'
    
workspaces:
  - name: '1'
    bind_to_monitor: 1
  - name: '2'
    bind_to_monitor: 1
  - name: '3'
    bind_to_monitor: 1
  - name: '4'
    bind_to_monitor: 1
  - name: '5'
    bind_to_monitor: 1
  - name: '6'
    bind_to_monitor: 1
  - name: '7'
    bind_to_monitor: 1
  - name: '8'
    bind_to_monitor: 1
  - name: '9'
    bind_to_monitor: 1
  - name: '10'
    bind_to_monitor: 1

  - name: '11'
    bind_to_monitor: 0
  - name: '12'
    bind_to_monitor: 0
  - name: '13'
    bind_to_monitor: 0
  - name: '14'
    bind_to_monitor: 0
  - name: '15'
    bind_to_monitor: 0

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#c4a7e7'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'
  other_windows:
    border:
      enabled: true
      color: '#404040'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: true
      shown_on_top: false

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { equals: 'intarsia' }
      - window_process: { equals: 'ZitiDesktopEdge' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }
      - window_process: { regex: 'LockApp' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

keybindings:
  # APPLICATION LAUNCHES (SUPER key)
  - commands: ['shell-exec pwsh']
    bindings: ['lwin+enter', 'rwin+enter']
  - commands: ['shell-exec firefox']
    bindings: ['lwin+b', 'rwin+b']
  - commands: ['shell-exec explorer']
    bindings: ['lwin+n', 'rwin+n']
  - commands: ['shell-exec devenv']
    bindings: ['lwin+v', 'rwin+v']

  # WINDOW MANAGEMENT
  - commands: ['close']
    bindings: ['lwin+e', 'rwin+e']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+f', 'rwin+f']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+m', 'rwin+m']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+t', 'rwin+t']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+s', 'rwin+s']

  # FOCUS MOVEMENT (SUPER+H/J/K/L)
  - commands: ['focus --direction left']
    bindings: ['lwin+h', 'rwin+h', 'lwin+left', 'rwin+left']
  - commands: ['focus --direction right']
    bindings: ['lwin+l', 'rwin+l', 'lwin+right', 'rwin+right']
  - commands: ['focus --direction up']
    bindings: ['lwin+k', 'rwin+k', 'lwin+up', 'rwin+up']
  - commands: ['focus --direction down']
    bindings: ['lwin+j', 'rwin+j', 'lwin+down', 'rwin+down']

  # WINDOW RESIZING (SUPER+SHIFT+H/J/K/L)
  - commands: ['resize --width -100px']
    bindings: ['lwin+shift+h', 'rwin+shift+h']
  - commands: ['resize --width +100px']
    bindings: ['lwin+shift+l', 'rwin+shift+l']
  - commands: ['resize --height +100px']
    bindings: ['lwin+shift+j', 'rwin+shift+j']
  - commands: ['resize --height -100px']
    bindings: ['lwin+shift+k', 'rwin+shift+k']

  # WINDOW SWAPPING (SUPER+ALT+H/J/K/L)
  - commands: ['move --direction left']
    bindings: ['lwin+alt+h', 'rwin+alt+h']
  - commands: ['move --direction right']
    bindings: ['lwin+alt+l', 'rwin+alt+l']
  - commands: ['move --direction up']
    bindings: ['lwin+alt+k', 'rwin+alt+k']
  - commands: ['move --direction down']
    bindings: ['lwin+alt+j', 'rwin+alt+j']

  # SLEEP
  - commands: ['shell-exec C:\Windows\System32\rundll32.exe powrprof.dll,SetSuspendState 0,1,0']
    bindings: ['lwin+ctrl+s', 'rwin+ctrl+s']

  # SYSTEM ACTIONS
  - commands: ['wm-reload-config']
    bindings: ['lwin+ctrl+r', 'rwin+ctrl+r']
  - commands: ['close']
    bindings: ['lwin+shift+e', 'rwin+shift+e']
  - commands: ['wm-redraw']
    bindings: ['lwin+shift+w', 'rwin+shift+w']
  - commands: ['wm-exit']
    bindings: ['lwin+shift+q', 'rwin+shift+q']

  # WORKSPACE SWITCHING (SUPER+1-0), monitor 1
  - commands: ['focus --workspace 1']
    bindings: ['lwin+1', 'rwin+1']
  - commands: ['focus --workspace 2']
    bindings: ['lwin+2', 'rwin+2']
  - commands: ['focus --workspace 3']
    bindings: ['lwin+3', 'rwin+3']
  - commands: ['focus --workspace 4']
    bindings: ['lwin+4', 'rwin+4']
  - commands: ['focus --workspace 5']
    bindings: ['lwin+5', 'rwin+5']
  - commands: ['focus --workspace 6']
    bindings: ['lwin+6', 'rwin+6']
  - commands: ['focus --workspace 7']
    bindings: ['lwin+7', 'rwin+7']
  - commands: ['focus --workspace 8']
    bindings: ['lwin+8', 'rwin+8']
  - commands: ['focus --workspace 9']
    bindings: ['lwin+9', 'rwin+9']
  - commands: ['focus --workspace 10']
    bindings: ['lwin+0', 'rwin+0']

  # WORKSPACE SWITCHING (SUPER+SHIFT+1-5), monitor 0
  - commands: ['focus --workspace 11']
    bindings: ['lwin+shift+1', 'rwin+shift+1']
  - commands: ['focus --workspace 12']
    bindings: ['lwin+shift+2', 'rwin+shift+2']
  - commands: ['focus --workspace 13']
    bindings: ['lwin+shift+3', 'rwin+shift+3']
  - commands: ['focus --workspace 14']
    bindings: ['lwin+shift+4', 'rwin+shift+4']
  - commands: ['focus --workspace 15']
    bindings: ['lwin+shift+5', 'rwin+shift+5']

  # MOVE WINDOW TO WORKSPACE (SUPER+CTRL+1-0), monitor 1
  - commands: ['move --workspace 1']
    bindings: ['lwin+ctrl+1', 'rwin+ctrl+1']
  - commands: ['move --workspace 2']
    bindings: ['lwin+ctrl+2', 'rwin+ctrl+2']
  - commands: ['move --workspace 3']
    bindings: ['lwin+ctrl+3', 'rwin+ctrl+3']
  - commands: ['move --workspace 4']
    bindings: ['lwin+ctrl+4', 'rwin+ctrl+4']
  - commands: ['move --workspace 5']
    bindings: ['lwin+ctrl+5', 'rwin+ctrl+5']
  - commands: ['move --workspace 6']
    bindings: ['lwin+ctrl+6', 'rwin+ctrl+6']
  - commands: ['move --workspace 7']
    bindings: ['lwin+ctrl+7', 'rwin+ctrl+7']
  - commands: ['move --workspace 8']
    bindings: ['lwin+ctrl+8', 'rwin+ctrl+8']
  - commands: ['move --workspace 9']
    bindings: ['lwin+ctrl+9', 'rwin+ctrl+9']
  - commands: ['move --workspace 10']
    bindings: ['lwin+ctrl+0', 'rwin+ctrl+0']

  # MOVE WINDOW TO WORKSPACE (SUPER+ALT+1-5), monitor 0
  - commands: ['move --workspace 11']
    bindings: ['lwin+alt+1', 'rwin+alt+1']
  - commands: ['move --workspace 12']
    bindings: ['lwin+alt+2', 'rwin+alt+2']
  - commands: ['move --workspace 13']
    bindings: ['lwin+alt+3', 'rwin+alt+3']
  - commands: ['move --workspace 14']
    bindings: ['lwin+alt+4', 'rwin+alt+4']
  - commands: ['move --workspace 15']
    bindings: ['lwin+alt+5', 'rwin+alt+5']

  # WORKSPACE CYCLING (SUPER+TAB)
  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+tab', 'rwin+tab']
  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+shift+tab', 'rwin+shift+tab']
  - commands: ['focus --recent-workspace']
    bindings: ['lwin+d', 'rwin+d']

  # RESIZE MODE (SUPER+R)
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+r', 'rwin+r']

  # ADDITIONAL BINDINGS
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+shift+p', 'rwin+shift+p']
  - commands: ['wm-cycle-focus']
    bindings: ['lwin+space', 'rwin+space']
